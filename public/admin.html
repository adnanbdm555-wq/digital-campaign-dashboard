<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Digital Campaign Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#101215; --panel:#1a1d22; --line:#2c3038; --red:#C8102E; --ink:#f3f1ea; --ink-dim:#9aa1ab; --good:#4fae7a; --amber:#d9a441; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;padding:32px 20px 80px;}
  .wrap{max-width:920px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 6px;}
  .sub{color:var(--ink-dim);font-size:13.5px;margin:0 0 24px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:18px;}
  .card h2{font-size:15px;margin:0 0 14px;}
  label{display:block;font-size:12px;color:var(--ink-dim);margin:10px 0 4px;}
  input,select{width:100%;background:#0d0f12;border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:13px;}
  input:focus,select:focus{outline:none;border-color:var(--red);}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .btn{background:transparent;border:1px solid var(--red);color:#fff;background:rgba(200,16,46,.15);padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;display:inline-block;}
  .btn:hover{background:rgba(200,16,46,.28);}
  .btn.secondary{border-color:#6b7684;background:transparent;font-weight:400;}
  .btn.secondary:hover{background:rgba(255,255,255,.06);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-dim);padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-dim);display:inline-block;margin-right:4px;}
  .dot.on{background:var(--good);}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--ink-dim);}
  .badge.admin{color:var(--amber);border-color:var(--amber);}
  #createMsg{font-size:12.5px;margin-top:10px;color:var(--ink-dim);}
  .footer-links{margin-top:24px;text-align:center;font-size:13px;}
  .footer-links a{color:var(--ink-dim);margin:0 8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div>
      <h1>Admin — Digital Campaign Dashboard</h1>
      <p class="sub" style="margin:0;">Create accounts for your team and see what each one has connected.</p>
    </div>
    <span id="whoami" style="font-size:12.5px;color:var(--ink-dim);"></span>
  </div>

  <div class="card">
    <h2>Create an account</h2>
    <div class="grid3">
      <div>
        <label>Display name</label>
        <input id="newDisplayName" placeholder="e.g. Adnan — Media Buying">
      </div>
      <div>
        <label>Username</label>
        <input id="newUsername" placeholder="username">
      </div>
      <div>
        <label>Password</label>
        <input id="newPassword" type="password" placeholder="6+ characters">
      </div>
    </div>
    <label style="margin-top:14px;">
      <input type="checkbox" id="newIsAdmin" style="width:auto;display:inline-block;margin-right:6px;vertical-align:middle;">
      <span style="font-family:'Inter',sans-serif;font-size:13px;">Give this account admin access too</span>
    </label>
    <div style="margin-top:14px;"><button class="btn" id="createBtn">Create account</button></div>
    <div id="createMsg"></div>
  </div>

  <div class="card">
    <h2>Team</h2>
    <table id="usersTable">
      <thead>
        <tr><th>Name</th><th>Connected</th><th>Last sync</th><th>Role</th><th></th></tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>

  <div class="footer-links">
    <a href="/">Control panel</a> · <a href="/dashboard.html">My dashboard</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function statusDots(u){
  const items = [
    ['Meta', u.metaConnected],
    ['Google', u.googleConnected],
    ['LinkedIn', u.linkedinConnected],
  ];
  return items.map(([label, on]) =>
    `<span style="margin-right:10px;white-space:nowrap;"><span class="dot ${on ? 'on' : ''}"></span>${label}</span>`
  ).join('');
}

async function loadUsers(){
  const res = await fetch('/api/admin/users');
  const users = await res.json();
  $('usersBody').innerHTML = users.map(u => `
    <tr>
      <td>
        <div style="font-weight:500;">${u.displayName}</div>
        <div style="font-size:11.5px;color:var(--ink-dim);">@${u.username}</div>
      </td>
      <td>${statusDots(u)}</td>
      <td style="color:var(--ink-dim);font-size:12px;">${u.lastSync ? new Date(u.lastSync).toLocaleString() : 'Never synced'}</td>
      <td><span class="badge ${u.role === 'admin' ? 'admin' : ''}">${u.role}</span></td>
      <td style="text-align:right;white-space:nowrap;">
        <a class="btn secondary" style="padding:5px 10px;font-size:12px;" href="/dashboard.html?as=${u.id}" target="_blank">View dashboard</a>
        <button class="btn secondary" style="padding:5px 10px;font-size:12px;" onclick="toggleRole('${u.id}','${u.role}')">${u.role === 'admin' ? 'Remove admin' : 'Make admin'}</button>
      </td>
    </tr>
  `).join('');
}

async function toggleRole(id, currentRole){
  const newRole = currentRole === 'admin' ? 'user' : 'admin';
  const res = await fetch(`/api/admin/users/${id}/role`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ role: newRole }),
  });
  const data = await res.json();
  if(!res.ok){ alert(data.error || 'Could not update role.'); return; }
  loadUsers();
}

$('createBtn').addEventListener('click', async () => {
  const displayName = $('newDisplayName').value.trim();
  const username = $('newUsername').value.trim();
  const password = $('newPassword').value;
  const role = $('newIsAdmin').checked ? 'admin' : 'user';
  const msgEl = $('createMsg');
  msgEl.textContent = 'Creating…';
  try{
    const res = await fetch('/api/admin/users', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password, displayName, role }),
    });
    const data = await res.json();
    if(!res.ok){ msgEl.textContent = data.error || 'Could not create the account.'; return; }
    msgEl.textContent = `Created ✓ — share the username and password with them directly.`;
    $('newDisplayName').value = ''; $('newUsername').value = ''; $('newPassword').value = ''; $('newIsAdmin').checked = false;
    loadUsers();
  }catch(e){
    msgEl.textContent = 'Could not reach the server.';
  }
});

fetch('/api/me').then(r => r.json()).then(me => {
  $('whoami').textContent = 'Logged in as ' + (me.displayName || me.username) + ' (admin)';
});

loadUsers();
</script>
</body>
</html>
